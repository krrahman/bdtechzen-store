<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 92" fill="none">
  <!-- 7-Hexagon Honeycomb Emblem matching uploaded BDTechZen logo -->
  <g stroke="#18181b" stroke-width="2" fill="#ffffff">
    <!-- Center Hexagon -->
    <polygon points="56,37 64,46 56,55 44,55 36,46 44,37" />
    <!-- Top Hexagon -->
    <polygon points="56,17 64,26 56,35 44,35 36,26 44,17" />
    <!-- Bottom Hexagon -->
    <polygon points="56,57 64,66 56,75 44,75 36,66 44,57" />
    <!-- Top-Left Hexagon -->
    <polygon points="37,27 45,36 37,45 25,45 17,36 25,27" />
    <!-- Bottom-Left Hexagon -->
    <polygon points="37,47 45,56 37,65 25,65 17,56 25,47" />
    <!-- Top-Right Hexagon -->
    <polygon points="75,27 83,36 75,45 63,45 55,36 63,27" />
    <!-- Bottom-Right Hexagon -->
    <polygon points="75,47 83,56 75,65 63,65 55,56 63,47" />
  </g>
  <!-- Golden Sparkle in Center Hexagon -->
  <g stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round">
    <line x1="50" y1="39.5" x2="50" y2="52.5" />
    <line x1="43.5" y1="46" x2="56.5" y2="46" />
    <line x1="46" y1="42" x2="54" y2="50" stroke-width="0.9" opacity="0.75" />
    <line x1="54" y1="42" x2="46" y2="50" stroke-width="0.9" opacity="0.75" />
    <circle cx="50" cy="46" r="1.6" fill="#fbbf24" stroke="none" />
  </g>
  <!-- Wordmark: BD (Black) + Tech (Italic Violet) + Zen (Black) -->
  <text x="92" y="62" font-family="Poppins, sans-serif" font-weight="700" font-size="44" letter-spacing="-1">
    <tspan fill="#09090b">BD</tspan><tspan fill="#7c3aed" font-style="italic">Tech</tspan><tspan fill="#09090b">Zen</tspan>
  </text>
</svg>
